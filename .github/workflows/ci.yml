name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The rules suites run against the Firestore emulator, which needs a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # The rules suites shell out to `firebase emulators:exec`. It is not a
      # project dependency — pulling the whole CLI into node_modules for two
      # test scripts is not worth it — so install it here instead.
      - run: npm install -g firebase-tools@15

      - run: npm run build
      - run: npm test
