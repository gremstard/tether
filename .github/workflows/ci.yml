name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The rules and end-to-end suites run against the Firebase emulators,
      # which need a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Not a project dependency: pulling the whole CLI into node_modules for a
      # few test scripts is not worth it.
      - run: npm install -g firebase-tools@15

      - run: npm run build

      # The end-to-end suite launches the real app, so it needs a display. The
      # runner has no configured Chromium sandbox helper, so the suite runs
      # without it here — CI only, never locally or in a build.
      - run: xvfb-run -a npm test
        env:
          TETHER_E2E_NO_SANDBOX: '1'

  package:
    # Catches the class of failure that only appears once the app is packaged —
    # a bundle whose signature does not validate is reported by macOS as
    # "damaged", and that reached users once already.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify the packaged app is signed and launchable
        run: |
          APP="release/mac-$(node -p "process.arch")/Tether.app"
          test -d "$APP" || { echo "no app bundle at $APP"; ls -R release | head -40; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Identifier=com.tether.desktop" \
            || { echo "bundle identifier was not applied"; exit 1; }
          echo "packaged app is validly signed"
