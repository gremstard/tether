name: Release

# Builds installers on a tag and attaches them to a GitHub Release.
#
# Each platform is built on its own runner deliberately: a Windows NSIS
# installer cannot be produced from macOS without Wine, and a macOS .dmg cannot
# be produced anywhere but macOS. Cross-building is not worth the fragility when
# the runners are free.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifacts: 'release/*.dmg'
          - os: windows-latest
            script: dist:win
            artifacts: 'release/*.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron and esbuild fetch binaries in postinstall; npm 11 gates those
      # behind the approvals recorded in package.json.
      - run: npm ci

      - run: npm run ${{ matrix.script }}
        env:
          # Unsigned builds. Signing needs an Apple Developer account for macOS
          # and a code-signing certificate for Windows; see docs/PACKAGING.md.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: tether-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Desktop builds of Tether.

            **These builds are signed ad-hoc but not notarized**, so macOS and
            Windows will both warn on first launch. Nothing is wrong with the
            download.

            **macOS 15 (Sequoia) or later:** open Tether, let it be blocked, then
            go to System Settings → Privacy & Security and click **Open Anyway**.
            (Apple removed the old Control-click → Open shortcut in Sequoia.)

            **macOS 14 or earlier:** Control-click the app and choose *Open*.

            **Either, from a terminal:**
            `xattr -dr com.apple.quarantine /Applications/Tether.app`

            **Windows:** SmartScreen → *More info* → *Run anyway*.
